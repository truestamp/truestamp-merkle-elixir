name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Erlang, Elixir, Go and Task via mise
        # Versions come from .tool-versions. Go runs the interop programs in interop/go/.
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Restore deps cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Fetch deps
        run: |
          mix local.hex --force --if-missing
          mix local.rebar --force --if-missing
          mix deps.get

      - name: Restore Go module and build caches
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('.tool-versions', 'interop/go/*/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: The gate (task ci)
        # The same gates as `task precommit`, with formatting checked rather than
        # rewritten: strict compile, credo, vectors/merkle.json current, no unused deps,
        # and the test suite with the Go interop programs (--include go_interop), which
        # rebuild every vectors/interop/ file and check vectors/merkle.json with each Go
        # implementation.
        run: task ci
